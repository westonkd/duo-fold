name: CI

on:
  push:
    branches: [main, 'release/**']
  # `labeled` and `unlabeled` are here for the release-rules job: its waivers are labels, and without these a pull
  # request stays red after you label it until someone pushes a commit, which teaches people to ignore the check.
  # `edited` for the same reason: REL-5 reads the description, so fixing the description has to rerun it.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Before anything slow: a key in the repository is the one mistake that can't be taken back by deleting it.
      - name: No private keys in the repository
        run: bash tools/check-secrets.sh
      - name: Unit tests, lint and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # A red unit test run is easier to read from the HTML report than from the log, so keep the reports.
      - name: Keep the unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
      # The instrumented tests only run on a device, so nothing else compiles them; from 0.6.8 to #381 they didn't build
      # at all and no check noticed. Compiling them is enough to catch that. The javac task runs the Kotlin compile
      # first, so this covers both the Kotlin tests and the Java fixtures.
      - name: Instrumented tests compile
        run: ./gradlew :app:compileDebugAndroidTestJavaWithJavac

  # The parts of the releases standard a machine can see: a change to what ships carries its own changelog line,
  # and a version bump comes on its own (docs/standards/releases.md, REL-7 and REL-13). Pull requests only, since
  # both rules are about what a pull request contains.
  release-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Branch, notes and version rules
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/check-release-rules.sh "origin/${{ github.base_ref }}"
